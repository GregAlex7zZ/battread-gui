name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "battread[all] @ git+https://github.com/GregAlex7zZ/battread.git"
      - run: python -m pip install -e ".[dev,build]" -r requirements-build.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python tools/check_code_docs.py
      - run: python -m pyright --pythonpath (Get-Command python).Source
      - run: python -m pytest
      - run: python -m build
